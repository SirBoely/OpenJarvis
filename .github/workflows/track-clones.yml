name: Track Git Clones

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-clones:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.TRAFFIC_TOKEN || github.token }}

      - name: Fetch clone traffic
        id: traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: |
          set -uo pipefail
          set +e
          gh api repos/${{ github.repository }}/traffic/clones > /tmp/traffic.json 2>/tmp/traffic-error.txt
          api_status=$?
          set -e

          if [ "$api_status" -eq 0 ] && jq -e '.clones | type == "array"' /tmp/traffic.json >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "CLONE_TRAFFIC_FETCH=PASS"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Clone traffic unavailable::GitHub traffic API is unavailable to the current token. Configure repository secret TRAFFIC_TOKEN with the required repository access to collect clone metrics. Existing accumulated data is preserved."
          cat /tmp/traffic-error.txt || true
          echo "CLONE_TRAFFIC_FETCH=DEGRADED_PRESERVED"
          exit 0

      - name: Update accumulated data
        if: steps.traffic.outputs.available == 'true'
        run: |
          python3 - <<'PYEOF'
          import json
          from datetime import datetime, timezone

          with open("/tmp/traffic.json") as f:
              traffic = json.load(f)

          data_path = ".github/clone-stats/clone-data.json"
          with open(data_path) as f:
              accumulated = json.load(f)

          daily = accumulated.get("daily", {})
          for entry in traffic.get("clones", []):
              date_key = entry["timestamp"][:10]
              daily[date_key] = entry["count"]

          total = sum(daily.values())
          accumulated["daily"] = dict(sorted(daily.items()))
          accumulated["total_clones"] = total
          accumulated["last_updated"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          with open(data_path, "w") as f:
              json.dump(accumulated, f, indent=2)
              f.write("\n")

          badge = {
              "schemaVersion": 1,
              "label": "Git Clones",
              "message": f"{total:,}",
              "color": "green",
              "namedLogo": "git"
          }
          with open(".github/clone-stats/badge.json", "w") as f:
              json.dump(badge, f, indent=2)
              f.write("\n")

          print(f"Updated: {total:,} total clones across {len(daily)} days")
          PYEOF

      - name: Commit and push
        if: steps.traffic.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/clone-stats/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update clone traffic data [skip ci]"
            git push
          fi
