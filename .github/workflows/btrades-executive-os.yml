name: B-Trades Executive Agentic OS

on:
  pull_request:
    paths:
      - 'btrades_executive_os/**'
      - 'tests/test_btrades_executive_os*.py'
      - '.github/workflows/btrades-executive-os.yml'
  push:
    branches: [main]
    paths:
      - 'btrades_executive_os/**'
      - 'tests/test_btrades_executive_os*.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Compile package
        run: python -m compileall -q btrades_executive_os
      - name: Run focused tests
        run: pytest -q tests/test_btrades_executive_os.py tests/test_btrades_executive_os_v2.py tests/test_btrades_executive_os_v3.py
      - name: Import smoke test
        run: python -c "from btrades_executive_os import ExecutiveTriage, ExecutiveControlPlane, EvidenceRegistry, PromotionController, RevenueAttributionEngine, SupplierSLAScorer, UnitEconomicsEngine, LedgerRouter, KPIDriftDetector, IncidentRemediationEngine, ProjectResourceOptimizer, PMOEvidenceWriter"
