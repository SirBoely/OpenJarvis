name: Dependency Vulnerability Gate

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# GitHub Dependency Review requires the repository Dependency Graph, which is
# not currently enabled. Keep an enforceable vulnerability gate independent of
# that repository feature. The official OSV reusable PR workflow compares base
# and head and fails when the PR introduces new known vulnerabilities.
permissions:
  actions: read
  contents: read
  # Required by the immutable Google reusable-workflow contract. SARIF upload
  # remains disabled below, so this grants no repository/source write authority.
  security-events: write

jobs:
  osv-pr-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@3adb4b14a2b0623876d18d863a498b785fb3752d # v2.3.8
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write
