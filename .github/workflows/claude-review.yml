name: Claude PR Review - Security Hold

on:
  workflow_dispatch:

# SECURITY HOLD:
# A public PR/comment is untrusted input. Until the external agent is isolated
# from repository write authority and its app-level permissions are
# independently verified, it must not receive secrets or execute on PR data.
permissions:
  contents: read

jobs:
  security-hold:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm security hold
        run: |
          echo "CLAUDE_PR_REVIEW=DISABLED"
          echo "REASON=untrusted PR content must not reach secret-bearing agent"
          echo "OWNER_ONLY_REENABLEMENT=required"
