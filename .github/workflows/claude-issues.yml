name: Claude Issue Fixer - Security Hold

on:
  workflow_dispatch:

# SECURITY HOLD:
# This repository is public. Untrusted issue/comment content must never invoke
# a secret-bearing, write-capable coding agent. The former issue/comment
# triggers are intentionally disabled until an isolated, owner-approved
# sandbox with independently verified write controls is available.
permissions:
  contents: read

jobs:
  security-hold:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm security hold
        run: |
          echo "CLAUDE_ISSUE_FIXER=DISABLED"
          echo "REASON=public untrusted content must not reach write-capable agent"
          echo "OWNER_ONLY_REENABLEMENT=required"
